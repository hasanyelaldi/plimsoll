# Aspect order of the Resilience4j Spring Boot annotations. Lower order = outer aspect, so by
# default @Retry wraps @CircuitBreaker: every retry passes through the breaker.
# verified_by: oracle -> plimsoll-core/src/test/java/io/github/hasanyelaldi/plimsoll/oracle/SpringAnnotationOrderOracleTest.java
- library: resilience4j-spring-boot4
  versions: "2.4.0"
  parameter: resilience4j.retry.retry-aspect-order
  value: 2147483642           # Ordered.LOWEST_PRECEDENCE - 5
  unit: aspect-order
  source: https://resilience4j.readme.io/docs/getting-started-3
  verified_by: oracle

- library: resilience4j-spring-boot4
  versions: "2.4.0"
  parameter: resilience4j.circuitbreaker.circuit-breaker-aspect-order
  value: 2147483643           # Ordered.LOWEST_PRECEDENCE - 4
  unit: aspect-order
  source: https://resilience4j.readme.io/docs/getting-started-3
  verified_by: oracle
