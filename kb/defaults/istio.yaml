# Istio VirtualService HTTPRetry, checked against the primary reference page.
- library: istio
  versions: "1.31"
  parameter: retries.attempts
  value: 2                    # default cluster-wide policy when `retries` is not specified
  unit: attempts-retries-only # totalAttempts = attempts + 1; 0 disables retries
  source: https://istio.io/v1.31/docs/reference/config/networking/virtual-service/#HTTPRetry
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: retries.retryOn
  value: connect-failure,refused-stream,unavailable,cancelled
  unit: conditions
  source: https://istio.io/v1.31/docs/reference/config/networking/virtual-service/#HTTPRetry
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: retries.backoff
  value: 25ms                 # base interval of exponential backoff
  unit: duration-base
  source: https://istio.io/v1.31/docs/reference/config/networking/virtual-service/#HTTPRetry
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: timeout
  value: unlimited            # HTTPRoute.timeout: "Timeout for HTTP requests, default is disabled."
  unit: duration
  source: https://istio.io/v1.31/docs/reference/config/networking/virtual-service/#HTTPRoute
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: retries.perTryTimeout
  value: route timeout        # route `timeout` default is none, so no per-try timeout
  unit: duration
  source: https://istio.io/v1.31/docs/reference/config/networking/virtual-service/#HTTPRetry
  verified_by: doc

# Istio has no jitter setting; the sidecar's Envoy router always jitters its retry back-off.
- library: istio
  versions: "1.31"
  parameter: retries.jitter
  value: true                 # "fully jittered exponential back-off algorithm", base 25ms, cap 10x base
  unit: boolean
  source: https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/router_filter
  verified_by: doc

# DestinationRule OutlierDetection, checked against the primary reference page.
- library: istio
  versions: "1.31"
  parameter: outlierDetection.consecutive5xxErrors
  value: 5                    # 0 disables
  unit: errors
  source: https://istio.io/v1.31/docs/reference/config/networking/destination-rule/#OutlierDetection
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: outlierDetection.consecutiveGatewayErrors
  value: 0                    # disabled by default
  unit: errors
  source: https://istio.io/v1.31/docs/reference/config/networking/destination-rule/#OutlierDetection
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: outlierDetection.interval
  value: 10s
  unit: duration
  source: https://istio.io/v1.31/docs/reference/config/networking/destination-rule/#OutlierDetection
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: outlierDetection.baseEjectionTime
  value: 30s
  unit: duration
  source: https://istio.io/v1.31/docs/reference/config/networking/destination-rule/#OutlierDetection
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: outlierDetection.maxEjectionPercent
  value: 10
  unit: percent
  source: https://istio.io/v1.31/docs/reference/config/networking/destination-rule/#OutlierDetection
  verified_by: doc
