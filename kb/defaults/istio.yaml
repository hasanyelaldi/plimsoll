# Istio VirtualService HTTPRetry, checked against the primary reference page.
- library: istio
  versions: "1.31"
  parameter: retries.attempts
  value: 2                    # default cluster-wide policy when `retries` is not specified
  unit: attempts-retries-only # totalAttempts = attempts + 1; 0 disables retries
  source: https://istio.io/v1.31/docs/reference/config/networking/virtual-service/#HTTPRetry
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: retries.retryOn
  value: connect-failure,refused-stream,unavailable,cancelled
  unit: conditions
  source: https://istio.io/v1.31/docs/reference/config/networking/virtual-service/#HTTPRetry
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: retries.backoff
  value: 25ms                 # base interval of exponential backoff
  unit: duration-base
  source: https://istio.io/v1.31/docs/reference/config/networking/virtual-service/#HTTPRetry
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: timeout
  value: unlimited            # HTTPRoute.timeout: "Timeout for HTTP requests, default is disabled."
  unit: duration
  source: https://istio.io/v1.31/docs/reference/config/networking/virtual-service/#HTTPRoute
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: retries.perTryTimeout
  value: route timeout        # route `timeout` default is none, so no per-try timeout
  unit: duration
  source: https://istio.io/v1.31/docs/reference/config/networking/virtual-service/#HTTPRetry
  verified_by: doc

# Istio has no jitter setting; the sidecar's Envoy router always jitters its retry back-off.
- library: istio
  versions: "1.31"
  parameter: retries.jitter
  value: true                 # "fully jittered exponential back-off algorithm", base 25ms, cap 10x base
  unit: boolean
  source: https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/router_filter
  verified_by: doc

# DestinationRule OutlierDetection, checked against the primary reference page.
- library: istio
  versions: "1.31"
  parameter: outlierDetection.consecutive5xxErrors
  value: 5                    # 0 disables
  unit: errors
  source: https://istio.io/v1.31/docs/reference/config/networking/destination-rule/#OutlierDetection
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: outlierDetection.consecutiveGatewayErrors
  value: 0                    # disabled by default
  unit: errors
  source: https://istio.io/v1.31/docs/reference/config/networking/destination-rule/#OutlierDetection
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: outlierDetection.interval
  value: 10s
  unit: duration
  source: https://istio.io/v1.31/docs/reference/config/networking/destination-rule/#OutlierDetection
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: outlierDetection.baseEjectionTime
  value: 30s
  unit: duration
  source: https://istio.io/v1.31/docs/reference/config/networking/destination-rule/#OutlierDetection
  verified_by: doc

- library: istio
  versions: "1.31"
  parameter: outlierDetection.maxEjectionPercent
  value: 10
  unit: percent
  source: https://istio.io/v1.31/docs/reference/config/networking/destination-rule/#OutlierDetection
  verified_by: doc

# ADR 0014: the failure classes each retryOn condition retries, from the Envoy router of Istio 1.31's proxy
# (istio/proxy release-1.31 pins Envoy 8893f913). A per-try timeout resets the stream locally (onPerTryTimeoutCommon),
# so it is retried only by conditions that retry resets. Conditions not listed here leave the classes UNKNOWN.
- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.connect-failure
  value: not-sent
  unit: failure-classes      # a connection failure or connect timeout (wouldRetryFromReset)
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.refused-stream
  value: not-sent
  unit: failure-classes      # a REFUSED_STREAM reset from the callee (wouldRetryFromReset)
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.reset
  value: not-sent,reset,timeout
  unit: failure-classes      # any reset, a connection failure and a per-try timeout's local reset included (wouldRetryFromReset)
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.reset-before-request
  value: not-sent
  unit: failure-classes      # resets before any byte was sent upstream (wouldRetryFromReset)
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.5xx
  value: not-sent,reset,timeout,status-500,status-502,status-503,status-504,status-5xx-other
  unit: failure-classes      # every 5xx response (wouldRetryFromHeaders) and every reset (wouldRetryFromReset)
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.gateway-error
  value: not-sent,reset,timeout,status-502,status-503,status-504
  unit: failure-classes      # 502, 503, 504 (isGatewayError) and every reset
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.retriable-4xx
  value: status-409
  unit: failure-classes      # 409 Conflict only (wouldRetryFromHeaders)
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.retriable-status-codes
  value: none
  unit: failure-classes      # the codes themselves are separate retryOn entries in Istio, mapped by status
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.cancelled
  value: none
  unit: failure-classes      # reads the grpc-status response header; an HTTP edge has none
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.deadline-exceeded
  value: none
  unit: failure-classes      # reads the grpc-status response header; an HTTP edge has none
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.internal
  value: none
  unit: failure-classes      # reads the grpc-status response header; an HTTP edge has none
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.resource-exhausted
  value: none
  unit: failure-classes      # reads the grpc-status response header; an HTTP edge has none
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: retryOn.unavailable
  value: none
  unit: failure-classes      # reads the grpc-status response header; an HTTP edge has none
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/retry_state_impl.cc
  verified_by: source

# ADR 0014: what the sidecar answers its caller once it gives up. A response status passes through unchanged.
- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: givesUpAs.not-sent
  value: status-503
  unit: failure-classes      # onUpstreamReset: 503 after a connection failure
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/router.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: givesUpAs.reset
  value: status-503,status-502
  unit: failure-classes      # onUpstreamReset: 503, or 502 after a protocol error
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/router.cc
  verified_by: source

- library: istio
  versions: "1.31 (Envoy 8893f913)"
  parameter: givesUpAs.timeout
  value: status-504
  unit: failure-classes      # onPerTryTimeoutCommon: timeout_response_code_, 504 by default (router.h)
  source: https://github.com/envoyproxy/envoy/blob/8893f913fc5b911f7c40a394186fe815a0bd7b85/source/common/router/router.cc
  verified_by: source

# A retries block without attempts: proto3 reads the absent int32 as 0, and ConvertPolicy turns a policy with
# attempts <= 0 into no retry policy at all. The same function converts the MeshConfig defaultHttpRetryPolicy, which
# route.go applies to a route without retries (ADR 0016).
- library: istio
  versions: "1.31"
  parameter: retries.attemptsUnset
  value: 0                    # "if in.Attempts <= 0 { // Configuration is explicitly disabling the retry policy."
  unit: attempts-retries-only
  source: https://github.com/istio/istio/blob/56245da4ce832744b2062aab045e39a5c033000b/pilot/pkg/networking/core/route/retry/retry.go
  verified_by: source

# Data plane mode (ADR 0017, #27): which edges an Istio layer applies to.
- library: istio
  versions: "1.32 (docs)"
  parameter: injection.default
  value: "false"
  unit: boolean              # no istio-injection, istio.io/rev or sidecar.istio.io/inject label: the pod gets no sidecar (unless enableNamespacesByDefault)
  source: https://istio.io/latest/docs/setup/additional-setup/sidecar-injection/
  verified_by: doc

- library: istio
  versions: "1.32 (docs)"
  parameter: waypoint.default
  value: "false"
  unit: boolean              # no istio.io/use-waypoint label on the Service or namespace: traffic to it uses no waypoint
  source: https://istio.io/latest/docs/ambient/usage/waypoint/
  verified_by: doc

- library: istio
  versions: "1.32 (docs)"
  parameter: ambient.default
  value: "false"
  unit: boolean              # no istio.io/dataplane-mode=ambient label on the namespace or pod: not in ambient mode
  source: https://istio.io/latest/docs/ambient/usage/add-workloads/
  verified_by: doc
