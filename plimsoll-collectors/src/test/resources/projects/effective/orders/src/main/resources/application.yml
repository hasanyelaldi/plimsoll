# Declared configuration of the service whose running configuration is effective/orders-configprops.json (#25).
spring:
  application:
    name: orders
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: payments
              uri: lb://payments-service
              predicates: [ "Path=/api/payments/**" ]
              filters:
                - name: Retry
                  args:
                    retries: 1
resilience4j:
  retry:
    instances:
      backend:
        max-attempts: 3
